<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("salas:theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Relatórios das aulas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500..900&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/shared.css">
<style>
  .rp { max-width: 900px; margin: 0 auto; padding: 44px 0 40px; display: flex; flex-direction: column; gap: 14px; }
  .rp h1 { font-size: 26px; font-weight: 600; }
  .row { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
  .row h3 { font-size: 16px; font-weight: 600; }
  .row .small { color: var(--ink-2); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .warn { background: var(--call-bg); color: var(--call); border: 1px solid var(--call-line); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
</style>
<link rel="stylesheet" href="/tema.css">
<link rel="icon" type="image/png" href="/logo.png">
</head>
<body>
<main class="rp" id="rp"><p class="small">Carregando…</p></main>
<footer class="brandmark"><img src="/logo.png" alt="" width="20" height="22"></footer>
<script src="/shared.js"></script>
<script>
(function () {
  'use strict';
  var A = App, esc = A.esc;
  var root = document.getElementById('rp');
  var token = '';
  try { token = localStorage.getItem('salas:professor') || ''; } catch (e) { token = ''; }
  var TZ = 'America/Sao_Paulo';
  function dt(ms) { return ms ? new Date(ms).toLocaleString('pt-BR', { timeZone: TZ, day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—'; }
  if (!token) { root.innerHTML = '<div class="card"><h1>Relatórios das aulas</h1><p>Entre no <a href="/professor">painel do professor</a> e volte para esta página.</p></div>'; return; }
  A.api('GET', '/api/professor/relatorios', null, token).then(function (r) {
    var h = '<p class="small"><a href="/professor">&larr; Aulas</a></p><h1>Relatórios das aulas</h1>';
    if (r.mode !== 'firebase') h += '<div class="warn">Os relatórios estão sendo guardados só em arquivo no servidor. Se o servidor não tiver disco persistente, eles somem quando você sobe uma atualização. Configure o Firebase (veja o README) para guardá-los para sempre.</div>';
    if (r.error) h += '<div class="warn">Aviso do armazenamento: ' + esc(r.error) + '</div>';
    h += r.reports.length ? r.reports.map(function (x) {
      var url = location.origin + '/relatorio/' + x.id;
      return '<div class="row"><div><h3>' + esc(x.title) + '</h3><p class="small">' + dt(x.startedAt) + ' · ' + (x.totals ? x.totals.joined : 0) + ' alunos · ' + (x.problems || 0) + ' problemas' + (x.phase === 'done' ? '' : ' · em andamento') + '</p></div>' +
        '<div class="actions"><a class="btn btn-primary btn-sm" href="/relatorio/' + x.id + '" target="_blank" rel="noopener">Abrir</a><button class="btn btn-sm" data-url="' + esc(url) + '" type="button">Copiar link</button></div></div>';
    }).join('') : '<p>Nenhuma aula com relatório ainda. O relatório nasce quando a 1ª rodada começa.</p>';
    root.innerHTML = h;
    root.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button[data-url]') : null;
      if (!b) return;
      A.copyText(b.getAttribute('data-url')).then(function (ok) { var o = b.textContent; b.textContent = ok ? 'Copiado!' : 'Copie manualmente'; setTimeout(function () { b.textContent = o; }, 1500); });
    });
  }, function (e) {
    root.innerHTML = '<div class="card"><h1>Relatórios das aulas</h1><p>' + esc(e.message) + '</p><p><a href="/professor">Entrar no painel do professor</a></p></div>';
  });
})();
</script>
</body>
</html>
